name: WcSdAi Downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downloads:
    name: Published installer downloads
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show the public release download entry
        shell: bash
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v1.4.0
        run: |
          printf '# WcSdAi downloads\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '[Download WcSdAi 1.4.0 installers and corresponding source](%s)\n\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Main download page: https://api.90z.cn/download . Existing accounts, billing, API providers, personal settings and conversations remain.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Older clients need one manual installation. Later supported releases offer in-app download, followed by explicit Install and restart. A cached download alone never installs on normal quit.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Supported installations: writable installed Mac apps and qualified Windows current-user installs. All-users, portable and unrecognized installations use the website installer.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Read the release verification for actual website/feed status and any hold notices. Update signing does not provide Apple notarization or a Windows publisher certificate.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'This workflow provides download directions only. It does not build, install or publish an application.\n' >> "$GITHUB_STEP_SUMMARY"
