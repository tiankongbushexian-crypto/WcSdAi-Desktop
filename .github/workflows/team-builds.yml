name: WcSdAi Downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downloads:
    name: Published installer downloads
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show the public release download entry
        shell: bash
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v1.2.0
        run: |
          printf '# WcSdAi downloads\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '[Download WcSdAi 1.2.0 installers and corresponding source](%s)\n\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Main download page: https://api.90z.cn/download . WcSdAi 1.2.0 adds account model settings and authorized image generation, and improves Windows rounded edges and avatar sizing. Existing API providers and conversations remain.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Read the release verification and any hold notices before installation.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Updates require a manual download and installation; the app does not install updates automatically.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'This workflow provides download directions only. It does not build or publish an application.\n' >> "$GITHUB_STEP_SUMMARY"
