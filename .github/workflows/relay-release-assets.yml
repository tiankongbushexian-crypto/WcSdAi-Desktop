name: Temporary verified release asset relay

on:
  workflow_dispatch:
    inputs:
      artifact_urls:
        description: Short-lived read-only URLs for the three approved public artifact ZIPs
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wcsdai-1.0.5-draft-asset-relay
  cancel-in-progress: false

jobs:
  relay:
    if: github.repository == 'tiankongbushexian-crypto/WcSdAi-Desktop-Downloads'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test bounded extraction and URL validation
        run: python3 -m unittest discover -s scripts -p 'test_relay_release_assets.py'
      - name: Transfer only the approved existing public release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/relay-release-assets.py
