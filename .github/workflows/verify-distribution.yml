name: WcSdAi Distribution Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and source integrity contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test validation failures and historical release compatibility
        run: node --test scripts/verify-distribution.test.mjs
      - name: Check the published metadata and stable update contract
        run: node scripts/verify-distribution.mjs
